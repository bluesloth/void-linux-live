#!/usr/sbin/nft -f
flush ruleset

# ——— inet filter: input hardening, output allowed ———
table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iif lo accept
        ct state established,related accept
        ct state invalid drop

        icmp type echo-request  limit rate 10/second accept
        icmpv6 type { echo-request, nd-neighbor-solicit, nd-router-advert, nd-neighbor-advert } accept

        # SSH is intentionally not exposed by default. To enable:
        #   add `tcp dport 22 ct state new accept` above `counter drop`
        #   and run: nft -f /etc/nftables.conf
        # (sshd itself may also need `sv start sshd`.)

        counter drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}